  Build the string in three layers. Layer one: required tools, joined with AND. ("Kubernetes" AND "Terraform"). Layer two: outcome verbs, grouped with OR. ("reduced deploy time" OR "improved reliability" OR "cut MTTR"). Layer three: exclusions for adjacent-but-wrong roles. (NOT "junior" NOT "intern" NOT "looking for"). Wrap each layer in parentheses to control precedence.

  The result is longer than a generic search and shorter than a kitchen-sink string. You want 200–800 results, not 47,000 and not 12. If you're under 200, you've over-constrained — drop one outcome verb. If you're over 1,000, you've under-constrained — add one tool or one exclusion.

  Document the string in your saved searches with a name that future-you will recognize. Include the role title, the role level, and the date. Boolean strings rot — what works in April returns garbage by October as platform ranking changes.

